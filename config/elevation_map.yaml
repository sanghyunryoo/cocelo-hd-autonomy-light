elevation_map:
  ros__parameters:
    registered_topic: "/cloud_registered"
    odom_topic: "/aft_mapped_to_init"
    output_topic: "/autonomy_light/elevation_map"
    base_frame: "hd/base"
    resolution: 0.05
    x_min: -2.0
    x_max: 2.0
    y_min: -2.0
    y_max: 2.0
    z_min: -1.5
    z_max: 1.0
