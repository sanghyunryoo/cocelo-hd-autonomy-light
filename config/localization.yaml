saved_map_localization:
  ros__parameters:
    odom_topic: /aft_mapped_to_init
    cloud_topic: /cloud_registered
    map_frame: map
    odom_frame: odom
    saved_map_file: ""

    tf:
      # Keep the map -> odom edge available while relocalization runs.
      publish_hz: 20.0

    localization:
      scan_voxel_size: 0.2
      map_voxel_size: 0.2
      feature_voxel_size: 0.5
      initial_submap_seconds: 2.0
      minimum_points: 500
      maximum_initial_points: 30000
      maximum_feature_points: 6000
      normal_radius: 0.8
      feature_radius: 1.2
      target_radius: 20.0
      update_period_seconds: 1.0
      filter_alpha: 0.2
      max_translation_step: 1.0
      max_rotation_step_radians: 0.35

    registration:
      voxel_size: 0.4
      max_correspondence_distance: 3.0
      correspondence_randomness: 20
      max_iterations: 32
      max_fitness: 0.5
